<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green-API Test Page</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f7f6; }
        .container {
    max-width: 1300px;
    margin: auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;}


	.left-column,
	.right-column {
    background: #FFFFFF;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);}

        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 15px; background: #9370DB; color: #fff; border: none; border-radius: 4px; cursor: pointer; margin-right: 5px; margin-bottom: 5px; }
        button:hover { background: #0056b3; }
        pre { background: #eee; padding: 10px; border-radius: 4px; overflow-x: auto; max-height: 300px; }
        fieldset { border: 1px solid #ddd; border-radius: 6px; padding: 15px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">

<div class="left-column">

    <h2>GREEN-API Тестирование</h2>

    <!-- Поля авторизации -->
    <fieldset>
        <legend>Авторизация (Данные инстанса)</legend>
        <div class="form-group">
            <label for="idInstance">idInstance:</label>
            <input type="text" id="idInstance" placeholder="Введите ваш idInstance">
        </div>
<p>
        <div class="form-group">
            <label for="apiTokenInstance">apiTokenInstance:</label>
            <input type="text" id="apiTokenInstance" placeholder="Введите ваш apiTokenInstance">
        </div>
    </fieldset>

    <!-- Кнопки методов учетной записи -->
    <fieldset>
        <legend>Методы</legend>
        <button onclick="callMethod('getSettings')">getSettings</button>
<p>
        <button onclick="callMethod('getStateInstance')">getStateInstance</button>
    </fieldset>

    <!-- Форма для отправки сообщения -->
    <fieldset>
        <legend>Отправка сообщений</legend>
        <div class="form-group">
            <label for="chatIdText">Phone/Chat ID (в формате 79991234567@c.us):</label>
            <input type="text" id="chatIdText" placeholder="79991234567@c.us">
        </div>
<p>
        <div class="form-group">
            <label for="messageText">Текст сообщения:</label>
            <input type="text" id="messageText" placeholder="Привет, мир!">
        </div>
<p>
        <button onclick="sendMessage()">sendMessage</button>
    </fieldset>

    <!-- Форма для отправки файла по URL -->
    <fieldset>
        <legend>Отправка файла по URL</legend>
        <div class="form-group">
            <label for="chatIdFile">Phone/Chat ID (в формате 79991234567@c.us):</label>
            <input type="text" id="chatIdFile" placeholder="79991234567@c.us">
        </div>
<p>
        <div class="form-group">
            <label for="fileUrl">URL файла:</label>
            <input type="text" id="fileUrl" placeholder="https://example.com/image.jpg">
        </div>
<p>
        <div class="form-group">
            <label for="fileName">Имя файла (с расширением):</label>
            <input type="text" id="fileName" placeholder="image.jpg">
        </div>
<p>
        <button onclick="sendFileByUrl()">sendFileByUrl</button>
    </fieldset>
</div>

<div class="right-column">

    <!-- Блок вывода -->
    <h3>Результат:</h3>
    <pre id="output">Здесь появится ответ API...</pre>
</div>
</div>

<script>
    const API_URL = 'https://api.green-api.com';

    function getCredentials() {
        const idInstance = document.getElementById('idInstance').value.trim();
        const apiTokenInstance = document.getElementById('apiTokenInstance').value.trim();
        if (!idInstance || !apiTokenInstance) {
            alert('Пожалуйста, введите idInstance и apiTokenInstance!');
            return null;
        }
        return { idInstance, apiTokenInstance };
    }

    async function callMethod(method) {
        const creds = getCredentials();
        if (!creds) return;

        const url = `${API_URL}/waInstance${creds.idInstance}/${method}/${creds.apiTokenInstance}`;
        
        try {
            const response = await fetch(url);
            const data = await response.json();
            document.getElementById('output').textContent = JSON.stringify(data, null, 2);
        } catch (error) {
            document.getElementById('output').textContent = 'Ошибка: ' + error.message;
        }
    }

    async function sendMessage() {
        const creds = getCredentials();
        if (!creds) return;

        const chatId = document.getElementById('chatIdText').value.trim();
        const message = document.getElementById('messageText').value.trim();

        if (!chatId || !message) {
            alert('Заполните Chat ID и Текст сообщения!');
            return;
        }

        const url = `${API_URL}/waInstance${creds.idInstance}/sendMessage/${creds.apiTokenInstance}`;
        
        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chatId, message })
            });
            const data = await response.json();
            document.getElementById('output').textContent = JSON.stringify(data, null, 2);
        } catch (error) {
            document.getElementById('output').textContent = 'Ошибка: ' + error.message;
        }
    }

    async function sendFileByUrl() {
        const creds = getCredentials();
        if (!creds) return;

        const chatId = document.getElementById('chatIdFile').value.trim();
        const urlFile = document.getElementById('fileUrl').value.trim();
        const fileName = document.getElementById('fileName').value.trim();

        if (!chatId || !urlFile || !fileName) {
            alert('Заполните все поля для отправки файла!');
            return;
        }

        const url = `${API_URL}/waInstance${creds.idInstance}/sendFileByUrl/${creds.apiTokenInstance}`;
        
        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chatId, urlFile, fileName })
            });
            const data = await response.json();
            document.getElementById('output').textContent = JSON.stringify(data, null, 2);
        } catch (error) {
            document.getElementById('output').textContent = 'Ошибка: ' + error.message;
        }
    }
</script>

</body>
</html>
